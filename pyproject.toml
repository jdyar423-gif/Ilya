[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ilya"
version = "0.1.0"
description = "Open-world, anytime, presentation-invariant, coherent typed decisions — a paradigm beyond System One models such as Jev"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["ilya*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
